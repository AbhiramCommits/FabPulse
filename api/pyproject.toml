[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabpulse"
version = "0.1.0"
description = "FabPulse — semiconductor equipment telemetry analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "SQLAlchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "psycopg[binary]>=3.1",
  "pyarrow>=15",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["fabpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["fabpulse"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

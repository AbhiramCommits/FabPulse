name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FABPULSE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fabpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Generate reduced raw dataset
        run: python data/generate.py --out data/raw --days 20 --seed 7
      - name: Ingest into Postgres
        working-directory: api
        run: python -m fabpulse.ingest --src ../data/raw --truncate
      - name: Pytest with coverage
        working-directory: api
        run: python -m pytest --cov=fabpulse --cov-report=term-missing --cov-report=xml --cov-fail-under=0
      - name: Enforce stats/ingest coverage gate
        working-directory: api
        run: coverage report --include="fabpulse/stats.py,fabpulse/ingest.py" --fail-under=85
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: api/coverage.xml

  web:
    name: web (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test -- --run --coverage
      - name: Production build
        run: npm run build
